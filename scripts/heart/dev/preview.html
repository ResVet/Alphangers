<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const q = new URLSearchParams(location.search);
const W = +(q.get('w') || 1500), Hh = +(q.get('h') || 1000);
const views = (q.get('views') || 'front,back,left,right,top,oblique').split(',');
const cut = q.get('cut');
const cols = Math.ceil(views.length / 2), rows = views.length > 1 ? 2 : 1;

r.setSize(W, Hh); r.setScissorTest(true); r.localClippingEnabled = true;
document.body.appendChild(r.domElement);

const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(3, 6, 8); scene.add(key);
const rim = new THREE.DirectionalLight(0xbfd8ff, 1.0); rim.position.set(-6, 2, -6); scene.add(rim);
const planes = cut ? [new THREE.Plane(new THREE.Vector3(...cut.split(':')[0].split('/').map(Number)).normalize(), +cut.split(':')[1])] : [];

const root = gl.scene;
root.traverse(o => {
  if (!o.isMesh) return;
  const hasCol = !!o.geometry.attributes.color;
  o.material = new THREE.MeshStandardMaterial({ color: hasCol ? 0xffffff : 0xb85a52, vertexColors: hasCol, roughness: .55, metalness: 0, side: THREE.DoubleSide, clippingPlanes: planes, flatShading: q.has('flat') });
});
scene.add(root);
const box = new THREE.Box3().setFromObject(root);
const c = q.get('t') ? new THREE.Vector3(...q.get('t').split('/').map(Number)) : box.getCenter(new THREE.Vector3());
const rad = box.getSize(new THREE.Vector3()).length() * 0.5 / +(q.get('zoom') || 1);
const V = { front: [0, 0, 1], back: [0, 0, -1], left: [1, 0, 0], right: [-1, 0, 0], top: [0, 1, 0.001], bottom: [0, -1, 0.001], oblique: [0.6, 0.35, 0.75], obliqueR: [-0.6, 0.3, 0.75], base: [-0.2, 0.55, -0.8], apex: [0.5, -0.6, 0.6] };
const cw = W / cols, ch = Hh / rows;
views.forEach((name, i) => {
  const cam = new THREE.PerspectiveCamera(30, cw / ch, 0.1, 200);
  const d = new THREE.Vector3(...(V[name] || name.split('/').map(Number))).normalize();
  cam.position.copy(c).addScaledVector(d, rad / Math.tan(15 * Math.PI / 180) * 0.95);
  cam.up.set(0, 1, 0); cam.lookAt(c);
  key.position.copy(cam.position).add(new THREE.Vector3(3, 5, 0));
  const x = (i % cols) * cw, y = (rows - 1 - Math.floor(i / cols)) * ch;
  r.setViewport(x, y, cw, ch); r.setScissor(x, y, cw, ch);
  scene.background = new THREE.Color(i % 2 ? 0x101312 : 0x0d100f);

</script></body></html>
